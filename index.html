<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextGenAML - Launching Soon</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f5132, #198754);
      color: white;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 40px;
    }

    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 52px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    p {
      font-size: 18px;
      opacity: 0.9;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .email {
      font-size: 16px;
      background: rgba(255,255,255,0.15);
      padding: 12px 20px;
      border-radius: 8px;
      display: inline-block;
    }

    .email a {
      color: #d1ffe0;
      text-decoration: none;
      font-weight: 600;
    }

    .footer {
      margin-top: 40px;
      font-size: 13px;
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    
    <div class="badge">Launching Soon</div>

    <h1>NextGenAML</h1>

    <p>
      Modern AML compliance platform built for Australia.<br>
      Designed for simplicity, scalability, and regulatory readiness.
    </p>

    <div class="email">
      Questions? Contact us at 
      <a href="mailto:sales@nextgenaml.com.au">sales@nextgenaml.com.au</a>
    </div>

    <div class="footer">
      © 2026 NextGenAML. All rights reserved.
    </div>

  </div>
</body>
</html>
